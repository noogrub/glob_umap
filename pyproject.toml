[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glob-umap"
version = "0.1.0"
description = "Reproducible globular-cluster catalogue and manifold analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6,<7",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
glob-umap = "glob_umap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
