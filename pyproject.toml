[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glob-umap"
version = "0.1.0"
description = "Reproducible globular-cluster catalogue and manifold analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6,<7",
    "scipy>=1.10,<2",
    # Python 3.10 support ends after scikit-learn 1.7:
    # https://pypi.org/project/scikit-learn/1.7.2/
    "scikit-learn>=1.7.2,<1.8",

    # https://pypi.org/project/umap-learn/0.5.12/
    "umap-learn>=0.5.12,<0.6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
glob-umap = "glob_umap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
